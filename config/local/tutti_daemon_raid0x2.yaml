# ============================================================================
# Host-local NVMeService configuration: 8 NVMe as TWO md RAID0 arrays.
#
#   tutti0 = NVMe 0-3 (NUMA 0, PCIe-local to GPU 0-3) at /mnt/tutti_md0
#   tutti1 = NVMe 4-7 (NUMA 1, PCIe-local to GPU 4-7) at /mnt/nvme4: the
#            host's existing md0 (XFS, 512K chunk) adopted in place -- the
#            daemon assembles the same superblocks over /dev/snvme4-7n1
#
# TP8 pairs ranks with arrays via device_groups '0,1,2,3;4,5,6,7': ranks 0-3
# read/write tutti0, ranks 4-7 tutti1, so no GPU<->NVMe traffic crosses the
# socket. Members name their array's mount as backing_mount_path and do not
# mount themselves; the daemon assembles, mounts and (on shutdown) stops each
# array. /mnt/nvme4 is therefore only available while the daemon runs.
#
# One-time creation (destroys the members' data):
#   scripts/tutti-raid0-create.sh tutti1 /mnt/nvme4 /dev/snvme4n1 ... /dev/snvme7n1
# ============================================================================

grpc:
  endpoint: "127.0.0.1:50051"

accelerators:
  - accel_id: 0
    view_root: "/mnt/gpu0"
  - accel_id: 1
    view_root: "/mnt/gpu1"
  - accel_id: 2
    view_root: "/mnt/gpu2"
  - accel_id: 3
    view_root: "/mnt/gpu3"
  - accel_id: 4
    view_root: "/mnt/gpu4"
  - accel_id: 5
    view_root: "/mnt/gpu5"
  - accel_id: 6
    view_root: "/mnt/gpu6"
  - accel_id: 7
    view_root: "/mnt/gpu7"

nvmes:
  - device_id: 0
    pci_addr: "0000:08:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 1
    pci_addr: "0000:4b:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 2
    pci_addr: "0000:57:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 3
    pci_addr: "0000:63:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 4
    pci_addr: "0000:d2:00.0"
    backing_mount_path: "/mnt/nvme4"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 5
    pci_addr: "0000:df:00.0"
    backing_mount_path: "/mnt/nvme4"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 6
    pci_addr: "0000:86:00.0"
    backing_mount_path: "/mnt/nvme4"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 7
    pci_addr: "0000:c5:00.0"
    backing_mount_path: "/mnt/nvme4"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false

raid0_arrays:
  - name: "tutti0"
    device_ids: [0, 1, 2, 3]
    mount_path: "/mnt/tutti_md0"
    auto_mount: true
  - name: "tutti1"
    device_ids: [4, 5, 6, 7]
    mount_path: "/mnt/nvme4"
    auto_mount: true

queue_pool:
  default_per_client: 16
  max_per_client: 32

lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30

unmount_retry:
  interval_ms: 1000
  max: 30
