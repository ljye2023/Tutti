# ============================================================================
# Host-local NVMeService configuration.
#
# Derived from ../local_nvme_config.yaml for NVMe 0-3 and GPU 0-7.
# Each NVMe exposes a host-kernel IO queue cap of 16 and is available to all
# configured accelerators (4-card runs use accel 0-3 only).
# ============================================================================

grpc:
  endpoint: "127.0.0.1:50051"

accelerators:
  - accel_id: 0
    view_root: "/mnt/gpu0"
  - accel_id: 1
    view_root: "/mnt/gpu1"
  - accel_id: 2
    view_root: "/mnt/gpu2"
  - accel_id: 3
    view_root: "/mnt/gpu3"
  - accel_id: 4
    view_root: "/mnt/gpu4"
  - accel_id: 5
    view_root: "/mnt/gpu5"
  - accel_id: 6
    view_root: "/mnt/gpu6"
  - accel_id: 7
    view_root: "/mnt/gpu7"

nvmes:
  - device_id: 0
    pci_addr: "0000:08:00.0"
    backing_mount_path: "/mnt/nvme0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: true
  - device_id: 1
    pci_addr: "0000:4b:00.0"
    backing_mount_path: "/mnt/nvme1"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: true
  - device_id: 2
    pci_addr: "0000:57:00.0"
    backing_mount_path: "/mnt/nvme2"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: true
  - device_id: 3
    pci_addr: "0000:63:00.0"
    backing_mount_path: "/mnt/nvme3"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: true

queue_pool:
  default_per_client: 16
  max_per_client: 32

lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30

unmount_retry:
  interval_ms: 1000
  max: 30
