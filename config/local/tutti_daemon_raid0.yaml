# ============================================================================
# Host-local NVMeService configuration: NVMe 0-3 as ONE md RAID0.
#
# Same devices as tutti_daemon.yaml, but the four namespaces are members of
# the md array "tutti0", mounted once at /mnt/tutti_md0. Every member names
# that mount as its backing_mount_path and does not mount itself; the daemon
# assembles (or adopts) the array after bring-up, mounts it, and stops it on
# shutdown before releasing the controllers.
#
# One-time creation (destroys the members' data):
#   scripts/tutti-raid0-create.sh tutti0 /mnt/tutti_md0 /dev/snvme0n1 ... /dev/snvme3n1
# ============================================================================

grpc:
  endpoint: "127.0.0.1:50051"

accelerators:
  - accel_id: 0
    view_root: "/mnt/gpu0"
  - accel_id: 1
    view_root: "/mnt/gpu1"
  - accel_id: 2
    view_root: "/mnt/gpu2"
  - accel_id: 3
    view_root: "/mnt/gpu3"
  - accel_id: 4
    view_root: "/mnt/gpu4"
  - accel_id: 5
    view_root: "/mnt/gpu5"
  - accel_id: 6
    view_root: "/mnt/gpu6"
  - accel_id: 7
    view_root: "/mnt/gpu7"

nvmes:
  - device_id: 0
    pci_addr: "0000:08:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 1
    pci_addr: "0000:4b:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 2
    pci_addr: "0000:57:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false
  - device_id: 3
    pci_addr: "0000:63:00.0"
    backing_mount_path: "/mnt/tutti_md0"
    namespace_id: 1
    kernel_ioq_cap: 16
    allowed_accel_ids: [0, 1, 2, 3, 4, 5, 6, 7]
    auto_mount: false

raid0_arrays:
  - name: "tutti0"
    device_ids: [0, 1, 2, 3]
    mount_path: "/mnt/tutti_md0"
    auto_mount: true

queue_pool:
  default_per_client: 16
  max_per_client: 32

lease:
  heartbeat_interval_sec: 10
  timeout_sec: 30

unmount_retry:
  interval_ms: 1000
  max: 30
